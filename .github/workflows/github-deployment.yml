# Seldon QA runs seldon.yml whenever GitHub records a successful Deployment that has an
# environment_url. Vercel only posts a commit status here, so this workflow turns Vercel's
# "production deploy finished" status into a GitHub Deployment pointing at the live site.
# It uses the built-in GITHUB_TOKEN; no secrets are needed for that part.
#
# Then the seldon-qa job runs the same seldon.yml with the Seldon CLI against the live site and
# writes the report to this run's summary page. It needs one repository secret, SELDON_API_KEY
# (Seldon -> Settings -> Developer). Without the secret the job is skipped with a notice.
name: Publish GitHub Deployment

on:
  status:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or branch that is live (default: main)"
        required: false
        default: main
      run_seldon:
        description: "Also run the Seldon QA tests against the live site"
        type: boolean
        required: false
        default: true

permissions:
  deployments: write
  contents: read

env:
  PRODUCTION_URL: https://tackle-sub-2ji7.vercel.app
  VERCEL_PROJECT: tackle-sub-2ji7

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only Vercel's successful production deploy of main for the tackle-sub-2ji7 project
    # (status context "Vercel – tackle-sub-2ji7"), or a manual run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.state == 'success' &&
       startsWith(github.event.context, 'Vercel') &&
       endsWith(github.event.context, 'tackle-sub-2ji7') &&
       contains(github.event.branches.*.name, 'main'))
    steps:
      - name: Create deployment and mark it successful
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.sha }}
          LOG_URL: ${{ github.event.target_url || '' }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          deployment_id=$(jq -n --arg ref "$REF" '{
              ref: $ref, environment: "Production", production_environment: true,
              auto_merge: false, required_contexts: [], description: "Vercel production deploy"
            }' | curl -fsS -X POST "${auth[@]}" "$api/deployments" -d @- | jq -r '.id')
          echo "Created deployment $deployment_id for $REF"

          jq -n --arg url "$PRODUCTION_URL" --arg log "$LOG_URL" '{
              state: "success", environment_url: $url, description: "Live on Vercel"
            } + (if $log == "" then {} else {log_url: $log} end)' \
            | curl -fsS -X POST "${auth[@]}" "$api/deployments/${deployment_id}/statuses" -d @- > /dev/null
          echo "Marked deployment $deployment_id successful at $PRODUCTION_URL"

  seldon-qa:
    needs: publish
    if: github.event_name != 'workflow_dispatch' || inputs.run_seldon
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SELDON_API_KEY: ${{ secrets.SELDON_API_KEY }}
      SELDON_NO_UPDATE_CHECK: "1"
      SELDON_BASE_URL: https://app.seldon.com
      SELDON_CLI: "@seldonqa/cli@0.14.2"
    steps:
      - name: Check for the Seldon API key
        id: key
        run: |
          if [ -z "${SELDON_API_KEY}" ]; then
            echo "::notice::Seldon QA skipped: add a SELDON_API_KEY repository secret (Settings > Secrets and variables > Actions)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.sha }}

      - uses: actions/setup-node@v4
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 22

      - name: Validate seldon.yml
        if: steps.key.outputs.present == 'true'
        run: npx -y "$SELDON_CLI" validate

      - name: Run Seldon QA against the live site
        if: steps.key.outputs.present == 'true'
        run: npx -y "$SELDON_CLI" run --url "$PRODUCTION_URL" --label github-actions --fail-on fail

      - name: Add the Seldon report to the run summary
        if: always() && steps.key.outputs.present == 'true'
        run: |
          {
            echo "## Seldon QA: ${PRODUCTION_URL} @ ${GITHUB_SHA::7}"
            npx -y "$SELDON_CLI" report --md --full || echo "_No report available (the run may not have started)._"
          } >> "$GITHUB_STEP_SUMMARY"
